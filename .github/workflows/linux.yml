name: Linux Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    # ubuntu-latest is Ubuntu 26.04 (resolute) as of November 2026
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        uses: ./.github/actions/install-llvm
        with:
          version: 22
          packages: clang-format-22

      - name: Format files
        run: find include test -type f -a \( -name "*.cc" -o -name "*.h" \) -print0 | xargs -0  clang-format-22 -i

      - name: Check for differences
        run: |
          git status --porcelain
          git status --porcelain | xargs -I {} -0 test -z \"{}\"
  abi:
    name: abi (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86, os: ubuntu-latest, flags: -m32 -DCISTA_SKIP_ALIGNMENT_CHECK }
          - { name: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      - name: Install 32bit toolchain
        if: matrix.name == 'x86'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-multilib

      - name: Check the 64bit layout
        run: |
          cmake -S . -B build -DCISTA_FMT=OFF -DCISTA_64BIT_OFFSET=ON             -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          cmake --build build --target cista-abi-test

  build:
    # ubuntu-latest is Ubuntu 26.04 (resolute) as of November 2026
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - name: GCC 15 Release
            cxx: g++-15
            cc: gcc-15
            mode: Release
          - name: GCC 15 Debug
            cxx: g++-15
            cc: gcc-15
            mode: Debug
            valgrind: true
          - name: Clang 22 Release
            cxx: clang++-22
            cc: clang-22
            mode: Release
            cxxflags: -stdlib=libc++
            ldflags: -lc++abi
          - name: Clang 22 Debug
            cxx: clang++-22
            cc: clang-22
            mode: Debug
            fuzz: true
          - key: Clang 22 Sanitizer
            cxx: clang++-22
            cc: clang-22
            mode: Debug
            cflags: -fsanitize=address,undefined -fno-omit-frame-pointer
            cxxflags: -fsanitize=address,undefined -fno-omit-frame-pointer

    env:
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get install -y --no-install-recommends ninja-build

      # ==== INSTALL ====
      - name: Install Clang
        uses: ./.github/actions/install-llvm
        with:
          packages: libstdc++-15-dev libc++-22-dev libc++abi-22-dev clang-tidy-22 libunwind-22-dev llvm-22 libfuzzer-22-dev llvm-22-dev libclang-rt-22-dev

      # ==== BUILD ====
      - name: CMake
        run: |
          cmake \
            -G Ninja -S . -B build \
            -DCISTA_FMT=OFF \
            -DCMAKE_C_COMPILER=${{ matrix.config.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_C_FLAGS="${{ matrix.config.cflags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.config.cxxflags }}" \
            -DCMAKE_CXX_LINKER_FLAGS=${{ matrix.config.ldflags }}" \
            -DCMAKE_CXX_EXE_LINKER_FLAGS="${{ matrix.config.ldflags }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.mode }} \
            -DCISTA_ZERO_OUT=${{ matrix.config.mode == 'Debug' && matrix.config.cc == 'gcc-15' }}
      - name: Build
        run: cmake --build build --target cista-test cista-test-single-header

      # ==== TESTS ====
      - name: Run Tests
        run: ./build/cista-test
      - name: Run Single Header Tests
        run: ./build/cista-test-single-header

      # ==== VALGRIND ====
      - name: Install Valgrind
        if: matrix.config.valgrind
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
      - name: Run Single Header Tests Valgrind
        if: matrix.config.valgrind
        run: valgrind --fair-sched=yes --error-exitcode=1 --show-reachable=yes --leak-check=full ./build/cista-test
      - name: Run Single Header Tests Tests Valgrind
        if: matrix.config.valgrind
        run: valgrind --fair-sched=yes --error-exitcode=1 --show-reachable=yes --leak-check=full ./build/cista-test-single-header

      # ==== FUZZ ====
      - name: Fuzzing
        if: matrix.config.fuzz
        run: |
          cmake --build build --target \
            cista-fuzz-bitset_verification \
            cista-fuzz-bitvec_verification \
            cista-fuzz-graph \
            cista-fuzz-hash_map_verification \
            cista-fuzz-hash_set \
            cista-fuzz-multimap_verification
          ./build/cista-fuzz-hash_set -max_total_time=120
          ./build/cista-fuzz-hash_map_verification -max_total_time=120
          ./build/cista-fuzz-bitset_verification -max_total_time=120
          ./build/cista-fuzz-bitvec_verification -max_total_time=120
          ./build/cista-fuzz-graph -max_total_time=120
          ./build/cista-fuzz-multimap_verification -max_total_time=120

      # ==== DISTRIBUTION ====
      - name: Upload Distribution
        if: matrix.config.mode == 'Release' && matrix.config.cc == 'gcc-15'
        uses: actions/upload-artifact@v4
        with:
          name: cista.h
          path: build/cista.h

      # ==== RELEASE ====
      - name: Upload Release
        if: github.event.action == 'published' && matrix.config.mode == 'Release' && matrix.config.cc == 'gcc-15'
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/cista.h
          asset_name: cista.h
          asset_content_type: text/plain
