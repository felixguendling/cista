name: 'Install LLVM'
description: 'Install LLVM'
inputs:
  version:
    description: 'LLVM version'
    required: false
    default: 22
  packages:
    description: 'Packages to install'
    required: false
    default: >
      clang-22
      clang-tools-22
      clang-format-22
      clang-tidy-22
      libc++-22-dev
      libc++abi-22-dev
      libclang-common-22-dev
      libclang-rt-22-dev
      libunwind-22-dev
runs:
  using: "composite"
  steps:
    - run: |
        sudo apt-get install -qq --no-install-recommends \
          apt-transport-https \
          ca-certificates \
          software-properties-common
        wget -nv -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        source /etc/os-release
        sudo add-apt-repository "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${{ inputs.version }} main"
        sudo apt-get update
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive

    # Workaround for package conflicts with a preinstalled LLVM 14. Only purge
    # what is installed: newer runner images don't ship it.
    - run: |
        # dpkg-query fails for unknown packages and bash runs with pipefail
        installed=$( (dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' \
          llvm \
          llvm-14 \
          python3-lldb-14 \
          libc++-dev \
          libc++1-14 \
          libc++abi-dev \
          libc++abi1-14 \
          libc++abi-14-dev \
          libunwind-14 \
          libunwind-14-dev \
          2>/dev/null || true) | awk '$1 == "ii" { print $2 }')
        if [ -n "$installed" ]; then
          sudo apt-get purge --auto-remove -y $installed
        fi
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive

    - run: |
        sudo apt-get install -y --no-install-recommends \
          ${{ inputs.packages }}
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
